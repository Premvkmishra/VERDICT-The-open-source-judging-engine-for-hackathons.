version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: verdict-db
    environment:
      POSTGRES_USER: verdict
      POSTGRES_PASSWORD: verdict
      POSTGRES_DB: verdict
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verdict -d verdict"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verdict-backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://verdict:verdict@db:5432/verdict
      SESSION_COOKIE_NAME: verdict_session
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
